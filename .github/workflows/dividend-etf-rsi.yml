name: 红利 ETF RSI(6) 监控

on:
  schedule:
    # GitHub Actions cron 使用 UTC；06:00 UTC = 北京时间 14:00
    - cron: "0 6 * * 1-5"
  workflow_dispatch:
    inputs:
      force_notify:
        description: "强制发送测试通知（即使 RSI(6) >= 20）"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: dividend-etf-rsi-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
      FEISHU_SIGNING_SECRET: ${{ secrets.FEISHU_SIGNING_SECRET }}
      SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
      FORCE_NOTIFY: ${{ github.event_name == 'workflow_dispatch' && inputs.force_notify || false }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run RSI monitor
        run: python monitor.py
