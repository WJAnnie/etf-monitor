name: Full A Production Validation

on:
  pull_request:
    paths:
      - 'trading-skill/src/trading_skill/**.py'
      - 'trading-skill/scripts/*.py'
      - 'trading-skill/configs/*.yaml'
      - 'trading-skill/tests/unit/*.py'
      - '.github/workflows/full-a-phase1.yml'
      - '.github/workflows/full-a-production-scan.yml'
  workflow_dispatch:

concurrency:
  group: full-a-production-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  new-pipeline-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: trading-skill
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install -r ../requirements.txt

      - name: 全量回归测试
        run: python -m pytest

      - name: STEP1-2 可交易证券池与候选发现验证
        run: |
          python -m scripts.collect_candidate_universe \
            --output full-a-results/candidate_universe_latest.json \
            --industry-limit 28 \
            --stock-strength-cap 120 \
            --stock-early-cap 100 \
            --fund-cap 100 \
            --strict

      - name: STEP2-3 全市场候选真实行业补全
        run: |
          python -m scripts.enrich_candidate_industries \
            --input full-a-results/candidate_universe_latest.json \
            --strict

      - name: STEP3 股票与ETF-LOF基础质量验证
        run: |
          python -m scripts.collect_fundamental_quality \
            --input full-a-results/candidate_universe_latest.json \
            --output full-a-results/fundamental_quality_latest.json \
            --strict

      - name: STEP3C ETF-LOF慢变量产品参考增强
        run: |
          python -m scripts.enrich_fund_product_references \
            --candidates full-a-results/candidate_universe_latest.json \
            --quality full-a-results/fundamental_quality_latest.json \
            --strict

      - name: STEP3-4 深扫资格队列验证
        run: |
          python -m scripts.build_deep_scan_queue \
            --input full-a-results/fundamental_quality_latest.json \
            --output full-a-results/deep_scan_queue_latest.json \
            --soft-target-min 80 \
            --capacity-max 150 \
            --strict

      - name: STEP4 正式深扫队列五周期行情
        run: |
          python -m scripts.collect_step4_bars \
            --queue full-a-results/deep_scan_queue_latest.json \
            --output full-a-results/step4_bars_latest.json \
            --workers 6 \
            --strict

      - name: STEP4B 五周期层级结构验证
        run: |
          python -m scripts.analyze_step4_structure \
            --bars full-a-results/step4_bars_latest.json \
            --output full-a-results/step4_structure_latest.json \
            --strict

      - name: STEP4C 买卖点生命周期验证
        run: |
          python -m scripts.analyze_step4_signal_lifecycle \
            --structure full-a-results/step4_structure_latest.json \
            --output full-a-results/step4_signal_lifecycle_latest.json \
            --strict

      - name: 打印新版STEP1-4C摘要
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c=Path('full-a-results/candidate_universe_latest.json')
          f=Path('full-a-results/fundamental_quality_latest.json')
          q=Path('full-a-results/deep_scan_queue_latest.json')
          b=Path('full-a-results/step4_bars_latest.json')
          s4=Path('full-a-results/step4_structure_latest.json')
          l4=Path('full-a-results/step4_signal_lifecycle_latest.json')
          if c.exists():
              p=json.loads(c.read_text(encoding='utf-8'))
              s=p.get('summary',{})
              print('可交易池=',s.get('tradeable_by_security_type'))
              print('权限/状态剔除=',s.get('exclusions'))
              print('数据质量=',s.get('data_quality'))
              print('行业分层=',s.get('selected_industry_pools'))
              print('候选类型=',s.get('candidate_by_security_type'))
              print('候选路线=',s.get('candidate_by_route'))
              print('基金资产类别=',s.get('candidate_by_fund_category'))
              print('候选行业补全=',p.get('candidate_industry_enrichment'))
              print('重点行业=',[(x.get('name'),x.get('pool'),x.get('state'),x.get('quality_score'),x.get('timing_score')) for x in p.get('selected_industries',[])[:20]])
          if f.exists():
              p=json.loads(f.read_text(encoding='utf-8'))
              print('STEP3摘要=',p.get('summary'))
              print('基金参考增强=',p.get('fund_reference_enrichment'))
          if q.exists():
              p=json.loads(q.read_text(encoding='utf-8'))
              print('STEP3->4深扫资格=',p.get('summary'))
              print('深扫身份前20=',[(x.get('code'),x.get('market'),x.get('security_type'),x.get('status'),x.get('tier')) for x in p.get('candidates',[])[:20]])
          if b.exists():
              p=json.loads(b.read_text(encoding='utf-8'))
              print('STEP4行情=',{
                  'candidate_count':p.get('candidate_count'),
                  'identity_valid_count':p.get('identity_valid_count'),
                  'loaded_count':p.get('loaded_count'),
                  'history_limited_count':p.get('history_limited_count'),
                  'history_tiers':p.get('history_tiers'),
                  'errors':len(p.get('errors',[])),
              })
          if s4.exists():
              p=json.loads(s4.read_text(encoding='utf-8'))
              print('STEP4B摘要=',p.get('summary'))
          if l4.exists():
              p=json.loads(l4.read_text(encoding='utf-8'))
              print('STEP4C摘要=',p.get('summary'))
          PY

      - name: Upload new pipeline validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: new-pipeline-production-validation
          path: trading-skill/full-a-results/*.json
          if-no-files-found: warn

  # 旧V3仅作为迁移期回归保护。它与新版主链并行运行，失败时不会掩盖新版是哪一层出问题。
  legacy-v3-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: trading-skill
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install -r ../requirements.txt

      - name: 旧V3候选预筛回归
        run: |
          python -m scripts.collect_full_a_universe_v3 \
            --output full-a-results/universe_latest.json \
            --prospect-limit 20 \
            --early-heat-limit 8 \
            --dynamic-supplement 4 \
            --leaders-per-industry 5 \
            --cross-market-limit 20 \
            --strict

      - name: 跨行业候选真实行业补全
        run: |
          python -m scripts.enrich_cross_industry_v3 \
            --universe full-a-results/universe_latest.json

      - name: 旧链账户权限桥与长历史五周期行情
        run: |
          python -m scripts.collect_candidate_bars_v3 \
            --universe full-a-results/universe_latest.json \
            --output full-a-results/candidate_bars_latest.json \
            --strict

      - name: 多周期一致性缠论深度扫描V3
        run: |
          python -m scripts.run_full_a_scan_v3 \
            --universe full-a-results/universe_latest.json \
            --bars full-a-results/candidate_bars_latest.json \
            --output full-a-results/scan_latest.json \
            --stage 'CI真实验证'

      - name: 打印旧V3回归摘要
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          universe=Path('full-a-results/universe_latest.json')
          bars=Path('full-a-results/candidate_bars_latest.json')
          scan=Path('full-a-results/scan_latest.json')
          if universe.exists():
              p=json.loads(universe.read_text(encoding='utf-8'))
              print('旧V3候选=',p.get('deduped_leader_candidates'),'允许深扫=',p.get('deep_scan_eligible_candidates'))
          if bars.exists():
              p=json.loads(bars.read_text(encoding='utf-8'))
              print('旧链上游候选=',p.get('upstream_candidate_count'),'权限剔除=',p.get('permission_excluded_count'))
              print('旧链允许下载=',p.get('candidate_count'),'成功=',p.get('loaded_count'),'异常=',len(p.get('errors',[])))
              print('权限剔除样本=',p.get('permission_excluded',[])[:10])
          if scan.exists():
              p=json.loads(scan.read_text(encoding='utf-8'))
              c=p.get('candidates',[])
              print('旧V3深扫=',p.get('deep_scanned'),'近期买点=',len(c),'推送=',sum(1 for x in c if x.get('push')))
              print('一买=',sum(1 for x in c if x.get('signal')=='FIRST_BUY'),'二买=',sum(1 for x in c if x.get('signal')=='SECOND_BUY'),'三买=',sum(1 for x in c if x.get('signal')=='THIRD_BUY'))
          PY

      - name: Upload legacy V3 regression
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-v3-regression
          path: trading-skill/full-a-results/*.json
          if-no-files-found: warn