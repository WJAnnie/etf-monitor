name: Full A Production Validation

on:
  pull_request:
    paths:
      - 'trading-skill/src/trading_skill/a_share_*.py'
      - 'trading-skill/src/trading_skill/industry_prospects.py'
      - 'trading-skill/src/trading_skill/industry_intelligence.py'
      - 'trading-skill/src/trading_skill/chan_policy_v2.py'
      - 'trading-skill/src/trading_skill/production_chan.py'
      - 'trading-skill/scripts/*.py'
      - 'trading-skill/tests/unit/test_a_share_*.py'
      - 'trading-skill/tests/unit/test_full_a_v2.py'
      - 'trading-skill/tests/unit/test_industry_prospects.py'
      - 'trading-skill/tests/unit/test_industry_intelligence.py'
      - 'trading-skill/tests/unit/test_chan_policy_v2.py'
      - 'trading-skill/tests/unit/test_production_chan.py'
      - '.github/workflows/full-a-phase1.yml'
      - '.github/workflows/full-a-production-scan.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: trading-skill
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install -r ../requirements.txt

      - name: 全量回归测试
        run: python -m pytest

      - name: 真实全A动态行业V3与前五候选预筛
        run: |
          python -m scripts.collect_full_a_universe_v3 \
            --output full-a-results/universe_latest.json \
            --prospect-limit 20 \
            --dynamic-supplement 5 \
            --leaders-per-industry 5 \
            --cross-market-limit 20 \
            --strict

      - name: 真实候选长历史五周期行情
        run: |
          python -m scripts.collect_candidate_bars_v2 \
            --universe full-a-results/universe_latest.json \
            --output full-a-results/candidate_bars_latest.json \
            --strict

      - name: 日线授权与多周期正式缠论深度扫描
        run: |
          python -m scripts.run_full_a_scan_v2 \
            --universe full-a-results/universe_latest.json \
            --bars full-a-results/candidate_bars_latest.json \
            --output full-a-results/scan_latest.json \
            --stage 'CI真实验证'

      - name: 打印V3验收摘要
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          universe_path=Path('full-a-results/universe_latest.json')
          bars_path=Path('full-a-results/candidate_bars_latest.json')
          scan_path=Path('full-a-results/scan_latest.json')
          if universe_path.exists():
              p=json.loads(universe_path.read_text(encoding='utf-8'))
              selected=p.get('selected_industries',[])
              quarantined=p.get('quarantined_high_position_industries',[])
              intelligence=p.get('industry_intelligence',[])
              print('模式=',p.get('mode'))
              print('全A加载=',p.get('all_a_stocks_loaded'),'行业=',p.get('industry_rows_loaded'))
              print('长期前景行业=',sum(1 for x in selected if x.get('prospect_theme')),'补充行业=',sum(1 for x in selected if not x.get('prospect_theme')),'高位隔离=',len(quarantined))
              print('行业资讯覆盖=',len(intelligence),'资讯错误=',len(p.get('industry_event_errors',[])))
              print('前五原始候选=',p.get('raw_leader_rows_before_dedup'),'行业去重=',p.get('deduped_industry_candidates'),'跨行业=',p.get('cross_market_candidates'),'总候选=',p.get('deduped_leader_candidates'))
              print('严格基本面=',p.get('fundamental_eligible_candidates'),'允许深扫=',p.get('deep_scan_eligible_candidates'))
              print('入选行业=',[(x.get('name'),x.get('prospect_theme'),x.get('heat_state'),x.get('change_60d')) for x in selected])
              print('高位隔离行业=',[(x.get('name'),x.get('change_60d'),x.get('change_ytd'),x.get('heat_state')) for x in quarantined[:20]])
              meaningful=[]
              for x in intelligence:
                  if x.get('major_positive') or x.get('major_negative') or x.get('report_events'):
                      meaningful.append((x.get('industry_name'),x.get('net_event_score'),len(x.get('major_positive',[])),len(x.get('major_negative',[])),len(x.get('report_events',[]))))
              print('行业重大事件样本=',meaningful[:20])
              leaders=p.get('leader_candidates',[])
              if leaders:
                  fp=leaders[0].get('fundamental_prefilter') or {}
                  print('样本行业财务策略=',leaders[0].get('name'),fp.get('industry_policy'),fp.get('valuation_focus'),fp.get('metric_focus'),(fp.get('latest') or {}).get('report_date'))
          if bars_path.exists():
              p=json.loads(bars_path.read_text(encoding='utf-8'))
              print('长历史候选=',p.get('candidate_count'),'成功=',p.get('loaded_count'),'异常数=',len(p.get('errors',[])))
              if p.get('symbols'):
                  s=p['symbols'][0]
                  print('样本历史长度: daily=',len(s.get('daily',[])),'weekly=',len(s.get('weekly',[])),'120m=',len(s.get('120m',[])),'30m=',len(s.get('30m',[])),'5m=',len(s.get('5m',[])))
          if scan_path.exists():
              p=json.loads(scan_path.read_text(encoding='utf-8'))
              candidates=p.get('candidates',[])
              pushed=[x for x in candidates if x.get('push')]
              print('深扫=',p.get('deep_scanned'),'近期日线授权候选=',len(candidates),'达到推送=',len(pushed))
              print('近期买点样本=',[(x.get('code'),x.get('name'),x.get('signal'),x.get('extended_signals'),x.get('timeframe'),x.get('structural_execution_maturity'),x.get('rise_since_signal_pct'),x.get('action')) for x in candidates[:20]])
          PY

      - name: Upload production validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-a-production-validation-v3
          path: trading-skill/full-a-results/*.json
          if-no-files-found: warn
