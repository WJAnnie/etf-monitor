name: Full A Production Validation

on:
  pull_request:
    paths:
      - 'trading-skill/src/trading_skill/**.py'
      - 'trading-skill/scripts/*.py'
      - 'trading-skill/configs/*.yaml'
      - 'trading-skill/tests/unit/*.py'
      - '.github/workflows/full-a-phase1.yml'
      - '.github/workflows/full-a-production-scan.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: trading-skill
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install -r ../requirements.txt

      - name: 全量回归测试
        run: python -m pytest

      - name: 新版可交易证券池与候选发现验证
        run: |
          python -m scripts.collect_candidate_universe \
            --output full-a-results/candidate_universe_latest.json \
            --industry-limit 28 \
            --stock-strength-cap 120 \
            --stock-early-cap 100 \
            --fund-cap 100 \
            --strict

      # 旧V3生产链作为后续基本面/缠论重构的回归保护；K线入口已有账户权限桥。
      - name: 旧V3候选预筛回归
        run: |
          python -m scripts.collect_full_a_universe_v3 \
            --output full-a-results/universe_latest.json \
            --prospect-limit 20 \
            --early-heat-limit 8 \
            --dynamic-supplement 4 \
            --leaders-per-industry 5 \
            --cross-market-limit 20 \
            --strict

      - name: 跨行业候选真实行业补全
        run: |
          python -m scripts.enrich_cross_industry_v3 \
            --universe full-a-results/universe_latest.json

      - name: 旧链账户权限桥与长历史五周期行情
        run: |
          python -m scripts.collect_candidate_bars_v3 \
            --universe full-a-results/universe_latest.json \
            --output full-a-results/candidate_bars_latest.json \
            --strict

      - name: 多周期一致性缠论深度扫描V3
        run: |
          python -m scripts.run_full_a_scan_v3 \
            --universe full-a-results/universe_latest.json \
            --bars full-a-results/candidate_bars_latest.json \
            --output full-a-results/scan_latest.json \
            --stage 'CI真实验证'

      - name: 打印验收摘要
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          candidate_path=Path('full-a-results/candidate_universe_latest.json')
          universe_path=Path('full-a-results/universe_latest.json')
          bars_path=Path('full-a-results/candidate_bars_latest.json')
          scan_path=Path('full-a-results/scan_latest.json')
          if candidate_path.exists():
              p=json.loads(candidate_path.read_text(encoding='utf-8'))
              s=p.get('summary',{})
              print('新版可交易池=',s.get('tradeable_by_security_type'))
              print('新版权限/状态剔除=',s.get('exclusions'))
              print('新版数据质量=',s.get('data_quality'))
              print('新版行业分层=',s.get('selected_industry_pools'))
              print('新版候选类型=',s.get('candidate_by_security_type'))
              print('新版候选路线=',s.get('candidate_by_route'))
              print('新版基金类别=',s.get('candidate_by_fund_category'))
              print('新版重点行业=',[(x.get('name'),x.get('pool'),x.get('state'),x.get('quality_score'),x.get('timing_score')) for x in p.get('selected_industries',[])[:20]])
          if universe_path.exists():
              p=json.loads(universe_path.read_text(encoding='utf-8'))
              print('旧V3候选=',p.get('deduped_leader_candidates'),'允许深扫=',p.get('deep_scan_eligible_candidates'))
          if bars_path.exists():
              p=json.loads(bars_path.read_text(encoding='utf-8'))
              print('旧链上游候选=',p.get('upstream_candidate_count'),'权限剔除=',p.get('permission_excluded_count'))
              print('旧链允许下载=',p.get('candidate_count'),'成功=',p.get('loaded_count'),'异常=',len(p.get('errors',[])))
              print('旧链权限剔除样本=',p.get('permission_excluded',[])[:10])
          if scan_path.exists():
              p=json.loads(scan_path.read_text(encoding='utf-8'))
              c=p.get('candidates',[])
              print('旧V3深扫=',p.get('deep_scanned'),'近期买点=',len(c),'推送=',sum(1 for x in c if x.get('push')))
              print('旧V3一买=',sum(1 for x in c if x.get('signal')=='FIRST_BUY'),'二买=',sum(1 for x in c if x.get('signal')=='SECOND_BUY'),'三买=',sum(1 for x in c if x.get('signal')=='THIRD_BUY'))
          PY

      - name: Upload production validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-a-production-validation-v3
          path: trading-skill/full-a-results/*.json
          if-no-files-found: warn
