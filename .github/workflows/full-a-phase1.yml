name: Full A Production Validation

on:
  pull_request:
    paths:
      - 'trading-skill/src/trading_skill/**.py'
      - 'trading-skill/scripts/*.py'
      - 'trading-skill/configs/*.yaml'
      - 'trading-skill/tests/unit/*.py'
      - '.github/workflows/full-a-phase1.yml'
      - '.github/workflows/full-a-production-scan.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: trading-skill
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install -r ../requirements.txt

      - name: 全量回归测试
        run: python -m pytest

      - name: 真实全A动态行业与前五候选预筛V3
        run: |
          python -m scripts.collect_full_a_universe_v3 \
            --output full-a-results/universe_latest.json \
            --prospect-limit 20 \
            --early-heat-limit 8 \
            --dynamic-supplement 4 \
            --leaders-per-industry 5 \
            --cross-market-limit 20 \
            --strict

      - name: 真实候选长历史五周期行情
        run: |
          python -m scripts.collect_candidate_bars_v2 \
            --universe full-a-results/universe_latest.json \
            --output full-a-results/candidate_bars_latest.json \
            --strict

      - name: 多周期一致性缠论深度扫描V3
        run: |
          python -m scripts.run_full_a_scan_v3 \
            --universe full-a-results/universe_latest.json \
            --bars full-a-results/candidate_bars_latest.json \
            --output full-a-results/scan_latest.json \
            --stage 'CI真实验证'

      - name: 打印V3验收摘要
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          universe_path=Path('full-a-results/universe_latest.json')
          bars_path=Path('full-a-results/candidate_bars_latest.json')
          scan_path=Path('full-a-results/scan_latest.json')
          if universe_path.exists():
              p=json.loads(universe_path.read_text(encoding='utf-8'))
              selected=p.get('selected_industries',[])
              print('全A=',p.get('all_a_stocks_loaded'),'行业=',p.get('industry_rows_loaded'))
              print('重点行业=',len(selected),'刚升温=',sum(1 for x in selected if x.get('rotation_state')=='刚开始升温'),'高位暂退=',len(p.get('paused_high_industries',[])))
              print('资讯匹配=',sum(1 for x in selected if x.get('events')),'资讯源=',p.get('industry_intelligence'))
              print('近期财报行业=',len(p.get('industry_recent_reports',{})))
              print('总候选=',p.get('deduped_leader_candidates'),'允许深扫=',p.get('deep_scan_eligible_candidates'))
              print('入选=',[(x.get('name'),x.get('rotation_state'),x.get('prospect_theme')) for x in selected])
          if bars_path.exists():
              p=json.loads(bars_path.read_text(encoding='utf-8'))
              print('长历史候选=',p.get('candidate_count'),'成功=',p.get('loaded_count'),'异常=',len(p.get('errors',[])))
              if p.get('symbols'):
                  s=p['symbols'][0]
                  print('历史长度 daily/weekly/120/30/5=',len(s.get('daily',[])),len(s.get('weekly',[])),len(s.get('120m',[])),len(s.get('30m',[])),len(s.get('5m',[])))
          if scan_path.exists():
              p=json.loads(scan_path.read_text(encoding='utf-8'))
              c=p.get('candidates',[])
              print('深扫=',p.get('deep_scanned'),'近期买点=',len(c),'推送=',sum(1 for x in c if x.get('push')))
              print('二买=',sum(1 for x in c if x.get('signal')=='SECOND_BUY'),'类二买=',sum(1 for x in c if x.get('extended_signal_types')))
              print('执行冲突=',sum(1 for x in c if not x.get('execution_structure_ok',True)))
              print('样本=',[(x.get('code'),x.get('signal'),x.get('class2_label'),x.get('timeframe'),x.get('action')) for x in c[:20]])
          PY

      - name: Upload production validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-a-production-validation-v3
          path: trading-skill/full-a-results/*.json
          if-no-files-found: warn
