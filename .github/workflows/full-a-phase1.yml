name: Full A Phase1 Screen

on:
  pull_request:
    paths:
      - 'trading-skill/src/trading_skill/a_share_*.py'
      - 'trading-skill/scripts/collect_full_a_universe.py'
      - 'trading-skill/tests/unit/test_a_share_*.py'
      - '.github/workflows/full-a-phase1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: trading-skill
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install -r ../requirements.txt
      - name: 单元测试
        run: python -m pytest tests/unit/test_a_share_universe.py tests/unit/test_a_share_fundamentals.py
      - name: 真实全A行业与龙头预筛
        run: |
          python scripts/collect_full_a_universe.py \
            --output full-a-results/universe_latest.json \
            --industry-limit 8 \
            --leaders-per-industry 3 \
            --strict
      - name: 打印预筛摘要
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('full-a-results/universe_latest.json').read_text(encoding='utf-8'))
          print('全A加载=', p['all_a_stocks_loaded'])
          print('行业加载=', p['industry_rows_loaded'])
          print('入选行业=', [(x['name'], x['rank_score'], x['heat_state']) for x in p['selected_industries']])
          print('龙头候选=', len(p['leader_candidates']))
          print('财务预筛通过=', p['fundamental_eligible_candidates'])
          print('行业成员异常=', p['member_errors'])
          print('财报异常=', p['finance_errors'])
          PY
      - name: Upload phase1 result
        uses: actions/upload-artifact@v4
        with:
          name: full-a-phase1-result
          path: trading-skill/full-a-results/universe_latest.json
