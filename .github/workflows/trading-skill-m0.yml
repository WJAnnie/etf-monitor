name: Trading Skill Core

on:
  pull_request:
    paths:
      - 'trading-skill/**'
      - 'portfolio_market_data_5m.py'
      - '.github/workflows/trading-skill-m0.yml'
  push:
    branches:
      - master
    paths:
      - 'trading-skill/**'
      - 'portfolio_market_data_5m.py'
      - '.github/workflows/trading-skill-m0.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trading-skill
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install -r ../requirements.txt
      - name: Test frozen core
        run: python -m pytest
