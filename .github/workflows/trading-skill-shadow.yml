name: Trading Skill Shadow Smoke

on:
  pull_request:
    paths:
      - 'trading-skill/src/trading_skill/shadow.py'
      - 'trading-skill/src/trading_skill/shadow_m5.py'
      - 'trading-skill/src/trading_skill/notifications.py'
      - 'trading-skill/scripts/run_shadow.py'
      - 'trading-skill/scripts/send_test_report.py'
      - 'trading-skill/tests/unit/test_shadow*.py'
      - 'trading-skill/tests/unit/test_notifications.py'
      - '.github/workflows/trading-skill-shadow.yml'
  push:
    branches:
      - master
    paths:
      - 'trading-skill/src/trading_skill/shadow.py'
      - 'trading-skill/src/trading_skill/shadow_m5.py'
      - 'trading-skill/src/trading_skill/notifications.py'
      - 'trading-skill/scripts/run_shadow.py'
      - 'trading-skill/scripts/send_test_report.py'
      - 'trading-skill/tests/unit/test_shadow*.py'
      - 'trading-skill/tests/unit/test_notifications.py'
      - '.github/workflows/trading-skill-shadow.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shadow-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: trading-skill
    env:
      FEISHU_WEBHOOK: ''
      FEISHU_SECRET: ''
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_CHAT_ID: oc_9df5fff3a390da378fc2714fdb2ea541

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install -r ../requirements.txt

      - name: 核心回归测试
        id: core_test
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python -m pytest 2>&1 | tee core-test.log
          status=${PIPESTATUS[0]}
          count=$(python - <<'PY'
          import re
          from pathlib import Path
          text=Path('core-test.log').read_text(encoding='utf-8', errors='ignore')
          matches=re.findall(r'(\d+) passed', text)
          print(matches[-1] if matches else '')
          PY
          )
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: 收盘五周期真实行情测试
        id: shadow_test
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_shadow.py \
            --summary ../data/latest_market_summary.json \
            --market-dir ../data/market \
            --m5-summary ../data/latest_market_5m_summary.json \
            --m5-market-dir ../data/market5 \
            --output shadow-results/latest_shadow_smoke.json \
            --strict

      - name: 打印测试摘要
        if: always()
        shell: bash
        run: |
          echo "核心回归：${{ steps.core_test.outcome }}"
          echo "核心测试数：${{ steps.core_test.outputs.count }}"
          echo "真实行情链：${{ steps.shadow_test.outcome }}"
          if [[ -f shadow-results/latest_shadow_smoke.json ]]; then
            python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('shadow-results/latest_shadow_smoke.json').read_text(encoding='utf-8'))
          print('基础行情快照=',p.get('generated_from_market_snapshot'))
          print('5分钟行情快照=',p.get('m5_snapshot'))
          print('分析标的=',f"{p.get('analyzed_symbols',0)}/{p.get('total_symbols',0)}")
          print('真实5分钟=',p.get('guardrails',{}).get('real_5m_loaded_symbols'))
          print('基础异常=',p.get('failures'))
          print('5分钟异常=',p.get('m5_failures'))
          PY
          fi

      - name: Upload shadow result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trading-skill-shadow-smoke
          path: trading-skill/shadow-results/latest_shadow_smoke.json
          if-no-files-found: warn

      - name: 最终质量门
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.core_test.outcome }}" != "success" ]]; then
            echo "[FATAL] 核心回归测试失败" >&2
            exit 1
          fi
          if [[ "${{ steps.shadow_test.outcome }}" != "success" ]]; then
            echo "[FATAL] 真实行情链测试失败" >&2
            exit 1
          fi
