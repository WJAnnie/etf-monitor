name: 持仓建议转发

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
  schedule:
    # 06:05 UTC = 北京时间 14:05；在 14:01 最终行情刷新后检查是否达到分析标准。
    - cron: "5 6 * * 1-5"

permissions:
  contents: read
  issues: read

concurrency:
  group: portfolio-advice-relay
  cancel-in-progress: false

jobs:
  relay:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event.issue.number == 1 && contains(github.event.comment.body, '<!-- portfolio-advice -->'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
      FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_CHAT_ID: oc_9df5fff3a390da378fc2714fdb2ea541
      SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
      PIPELINE_STATUS_PATH: data/pipeline_status.json
      MARKET_SUMMARY_PATH: data/latest_market_summary.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Gate, notify, and record status
        run: python relay_issue_comment.py

      - name: Upload pipeline status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-pipeline-status-${{ github.run_id }}
          path: data/pipeline_status.json
          if-no-files-found: error

      - name: Publish pipeline summary
        if: always()
        run: |
          if [ -f data/pipeline_status.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          status=json.loads(Path('data/pipeline_status.json').read_text(encoding='utf-8'))
          print('portfolio pipeline status:')
          for key in ('market_data','analysis','github_issue','feishu','serverchan','overall'):
              print(f'{key}={status.get(key)}')
          PY
          fi
