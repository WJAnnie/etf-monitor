name: 持仓行情数据采集

on:
  schedule:
    # GitHub Actions cron 为 UTC。
    # 05:50 UTC = 北京时间 13:50：预采集，提前验证行情源与数据完整性。
    - cron: "50 5 * * 1-5"
    # 06:01 UTC = 北京时间 14:01：最终刷新，尽量纳入截至14:00的完整15分钟K线。
    - cron: "1 6 * * 1-5"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "portfolio_market_data.py"
      - ".github/workflows/portfolio-market-data.yml"

permissions:
  contents: write

concurrency:
  group: portfolio-market-data
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Collect daily and 15-minute OHLCV
        run: python portfolio_market_data.py

      - name: Commit latest market data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest_market_data.json data/latest_market_summary.json data/market/*.json
          if git diff --cached --quiet; then
            echo "No market-data change"
          else
            git commit -m "data: refresh portfolio market data"
            git push
          fi
