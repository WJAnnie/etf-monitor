name: Portfolio pipeline tests

on:
  push:
    paths:
      - "scripts/**"
      - "relay_issue_comment.py"
      - "tests/test_portfolio_pipeline.py"
      - ".github/workflows/portfolio-pipeline-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run pipeline unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
