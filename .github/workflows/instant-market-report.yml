name: Instant A Share Market Report

on:
  push:
    branches:
      - master
    paths:
      - 'trading-skill/reports/latest_market_report.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: trading-skill
    env:
      FEISHU_WEBHOOK: ''
      FEISHU_SECRET: ''
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_CHAT_ID: oc_9df5fff3a390da378fc2714fdb2ea541
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install -e .
          python -m pip install -r ../requirements.txt
      - name: 发送即时A股报告到飞书
        run: python scripts/send_market_report.py --report reports/latest_market_report.txt
