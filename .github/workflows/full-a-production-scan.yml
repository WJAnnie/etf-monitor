name: 全A正式买点扫描

on:
  schedule:
    - cron: '45 5 * * 1-5'
    - cron: '45 6 * * 1-5'
    - cron: '30 8 * * 1-5'
  workflow_dispatch:
    inputs:
      stage:
        description: '扫描时点'
        required: true
        type: choice
        default: '16:30收盘确认'
        options:
          - '13:45盘中扫描'
          - '14:45收盘前扫描'
          - '16:30收盘确认'

permissions:
  contents: read

concurrency:
  group: full-a-production-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: trading-skill
    env:
      FEISHU_WEBHOOK: ''
      FEISHU_SECRET: ''
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_CHAT_ID: oc_9df5fff3a390da378fc2714fdb2ea541
      TRADING_EQUITY: ${{ secrets.TRADING_EQUITY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install -r ../requirements.txt

      - name: 确定扫描时点
        id: stage
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            STAGE='${{ inputs.stage }}'
          else
            case "${{ github.event.schedule }}" in
              '45 5 * * 1-5') STAGE='13:45盘中扫描' ;;
              '45 6 * * 1-5') STAGE='14:45收盘前扫描' ;;
              '30 8 * * 1-5') STAGE='16:30收盘确认' ;;
              *) STAGE='16:30收盘确认' ;;
            esac
          fi
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
          echo "本轮时点：$STAGE"

      # 新第一/二步先独立产出并留档；后续基本面与缠论重构完成前，不强绑旧V3数据合同。
      - name: 新版可交易池与候选发现
        run: |
          python -m scripts.collect_candidate_universe \
            --output full-a-results/candidate_universe_latest.json \
            --industry-limit 28 \
            --stock-strength-cap 120 \
            --stock-early-cap 100 \
            --fund-cap 100 \
            --strict

      - name: 旧V3候选预筛回归
        run: |
          python -m scripts.collect_full_a_universe_v3 \
            --output full-a-results/universe_latest.json \
            --prospect-limit 20 \
            --early-heat-limit 8 \
            --dynamic-supplement 4 \
            --leaders-per-industry 5 \
            --cross-market-limit 20 \
            --strict

      - name: 跨行业候选真实行业补全
        run: |
          python -m scripts.enrich_cross_industry_v3 \
            --universe full-a-results/universe_latest.json

      - name: 账户权限桥与候选长历史五周期行情
        run: |
          python -m scripts.collect_candidate_bars_v3 \
            --universe full-a-results/universe_latest.json \
            --output full-a-results/candidate_bars_latest.json \
            --strict

      - name: 多周期一致性缠论深度扫描V3
        run: |
          python -m scripts.run_full_a_scan_v3 \
            --universe full-a-results/universe_latest.json \
            --bars full-a-results/candidate_bars_latest.json \
            --output full-a-results/scan_latest.json \
            --stage '${{ steps.stage.outputs.stage }}'

      - name: 飞书中文报告V3
        run: |
          python -m scripts.send_full_a_report_v3 \
            --scan full-a-results/scan_latest.json \
            --bars full-a-results/candidate_bars_latest.json \
            --universe full-a-results/universe_latest.json \
            --stage '${{ steps.stage.outputs.stage }}'

      - name: Upload scan result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-a-production-${{ github.run_id }}
          path: trading-skill/full-a-results/*.json
          if-no-files-found: warn
