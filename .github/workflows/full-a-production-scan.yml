name: 全A正式策略扫描

on:
  schedule:
    - cron: '45 5 * * 1-5'
    - cron: '45 6 * * 1-5'
    - cron: '30 8 * * 1-5'
  workflow_dispatch:
    inputs:
      stage:
        description: '扫描时点'
        required: true
        type: choice
        default: '16:30收盘确认'
        options:
          - '13:45盘中扫描'
          - '14:45收盘前扫描'
          - '16:30收盘确认'

permissions:
  contents: read

concurrency:
  group: full-a-production-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: trading-skill
    env:
      FEISHU_WEBHOOK: ''
      FEISHU_SECRET: ''
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_CHAT_ID: oc_9df5fff3a390da378fc2714fdb2ea541

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install -r ../requirements.txt

      - name: 确定扫描时点
        id: stage
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            STAGE='${{ inputs.stage }}'
          else
            case "${{ github.event.schedule }}" in
              '45 5 * * 1-5') STAGE='13:45盘中扫描' ;;
              '45 6 * * 1-5') STAGE='14:45收盘前扫描' ;;
              '30 8 * * 1-5') STAGE='16:30收盘确认' ;;
              *) STAGE='16:30收盘确认' ;;
            esac
          fi
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
          echo "本轮时点：$STAGE"

      - name: STEP1-2 可交易证券池与动态候选发现
        run: |
          python -m scripts.collect_candidate_universe \
            --output full-a-results/candidate_universe_latest.json \
            --industry-limit 28 \
            --stock-strength-cap 120 \
            --stock-early-cap 100 \
            --fund-cap 100 \
            --strict

      - name: STEP2-3 候选真实行业补全
        run: |
          python -m scripts.enrich_candidate_industries \
            --input full-a-results/candidate_universe_latest.json \
            --strict

      - name: STEP3 股票行业化基本面与ETF-LOF产品质量
        run: |
          python -m scripts.collect_fundamental_quality \
            --input full-a-results/candidate_universe_latest.json \
            --output full-a-results/fundamental_quality_latest.json \
            --strict

      - name: STEP3C ETF-LOF慢变量产品参考增强
        run: |
          python -m scripts.enrich_fund_product_references \
            --candidates full-a-results/candidate_universe_latest.json \
            --quality full-a-results/fundamental_quality_latest.json \
            --strict

      - name: STEP3-4 构建正式深扫队列
        run: |
          python -m scripts.build_deep_scan_queue \
            --input full-a-results/fundamental_quality_latest.json \
            --output full-a-results/deep_scan_queue_latest.json \
            --soft-target-min 80 \
            --capacity-max 150 \
            --strict

      - name: STEP4 五周期真实行情
        run: |
          python -m scripts.collect_step4_bars \
            --queue full-a-results/deep_scan_queue_latest.json \
            --output full-a-results/step4_bars_latest.json \
            --workers 6 \
            --strict

      - name: STEP4B 五周期层级结构
        run: |
          python -m scripts.analyze_step4_structure \
            --bars full-a-results/step4_bars_latest.json \
            --output full-a-results/step4_structure_latest.json \
            --strict

      - name: STEP4C 买卖点生命周期
        run: |
          python -m scripts.analyze_step4_signal_lifecycle \
            --structure full-a-results/step4_structure_latest.json \
            --bars full-a-results/step4_bars_latest.json \
            --output full-a-results/step4_signal_lifecycle_latest.json \
            --strict

      - name: STEP4D 日线授权与120m-30m-5m执行链
        run: |
          python -m scripts.analyze_step4_technical_opportunity \
            --lifecycle full-a-results/step4_signal_lifecycle_latest.json \
            --output full-a-results/step4_technical_opportunity_latest.json \
            --strict

      - name: STEP5A 独立交易许可门
        run: |
          python -m scripts.analyze_step5_trade_permission \
            --technical full-a-results/step4_technical_opportunity_latest.json \
            --quality full-a-results/fundamental_quality_latest.json \
            --candidates full-a-results/candidate_universe_latest.json \
            --structure full-a-results/step4_structure_latest.json \
            --output full-a-results/step5_trade_permission_latest.json \
            --strict

      - name: STEP5B TEST风险预算与仓位包络
        run: |
          python -m scripts.analyze_step5b_entry_sizing \
            --permission full-a-results/step5_trade_permission_latest.json \
            --output full-a-results/step5b_entry_sizing_latest.json \
            --strict

      - name: STEP5C 共享组合容量分配
        run: |
          python -m scripts.analyze_step5c_portfolio_allocation \
            --sizing full-a-results/step5b_entry_sizing_latest.json \
            --output full-a-results/step5c_portfolio_allocation_latest.json \
            --strict

      - name: STEP5D 执行意图与外部预留边界
        run: |
          python -m scripts.analyze_step5d_execution_intent \
            --allocation full-a-results/step5c_portfolio_allocation_latest.json \
            --sizing full-a-results/step5b_entry_sizing_latest.json \
            --output full-a-results/step5d_execution_intent_latest.json \
            --strict

      - name: 飞书STEP1-5D统一策略报告
        run: |
          python -m scripts.send_full_a_pipeline_report \
            --candidates full-a-results/candidate_universe_latest.json \
            --quality full-a-results/fundamental_quality_latest.json \
            --technical full-a-results/step4_technical_opportunity_latest.json \
            --permission full-a-results/step5_trade_permission_latest.json \
            --sizing full-a-results/step5b_entry_sizing_latest.json \
            --allocation full-a-results/step5c_portfolio_allocation_latest.json \
            --execution full-a-results/step5d_execution_intent_latest.json \
            --stage '${{ steps.stage.outputs.stage }}'

      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-a-production-${{ github.run_id }}
          path: trading-skill/full-a-results/*.json
          if-no-files-found: warn
